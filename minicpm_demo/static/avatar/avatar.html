<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11141e">
    <title>实时交互数字人</title>
    <link rel="stylesheet" href="/static/avatar/avatar.css?v=prompt2">
    <link rel="modulepreload" href="/static/avatar/avatar-app.js?v=prompt2">
    <link rel="modulepreload" href="/static/avatar/avatar-player.js?v=prompt2">
</head>
<body>
    <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
        <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9v6m4-9v12m4-15v18m4-15v12m4-9v6"/></symbol>
        <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></symbol>
        <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
        <symbol id="i-prompt" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8m-8 4h8m-8 4h5"/></symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l-2 2V11a9 9 0 0 1 9-9h2a8 8 0 0 1 8 8v2Z"/><path d="M7 10h10m-10 4h6"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
        <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-2L20 8M4 16l2.3 3A7 7 0 0 0 18 17"/></symbol>
    </defs></svg>
    <header class="app-header">
        <a class="brand" href="/avatar" aria-label="实时交互数字人首页"><span class="brand-mark"><svg><use href="#i-sound"/></svg></span><span>实时交互数字人<small>自然交流，实时回应</small></span></a>
        <div class="header-status">
            <a class="mode-link" href="/omni">完整 Omni</a>
            <span class="feature-label">音频全双工</span>
            <span class="connection" id="serviceStatus" role="status"><i></i><span>连接中</span></span>
        </div>
    </header>
    <main class="workspace">
        <section class="portrait-card" aria-label="数字人">
            <div class="portrait-stage">
                <img class="portrait-poster" src="/static/avatar/avatar-poster.jpg" alt="数字人形象" width="480" height="864" fetchpriority="high">
                <canvas id="avatarCanvas" width="480" height="864" aria-label="数字人实时画面"></canvas>
                <div class="portrait-shade"></div>
                <div class="portrait-topline"><span class="live-label"><i></i>LIVE</span><span class="portrait-time" id="sessionClock">00:00</span></div>
                <div class="portrait-heading"><span class="portrait-eyebrow">你的实时语音伙伴</span><h1>随时开口，自然对话</h1></div>
                <div class="avatar-subtitle" id="avatarSubtitle" hidden></div>
                <div class="portrait-bottom"><span class="avatar-status" id="avatarStatus" data-state="off">准备好后，点击开始对话</span><span class="listening-light" aria-hidden="true"></span></div>
            </div>
            <div class="session-toolbar">
                <div class="mic-monitor"><svg><use href="#i-mic"/></svg><div class="level-track"><span id="micLevel"></span></div><span id="micState">麦克风未开启</span></div>
                <div class="session-actions">
                    <button class="button button-primary" id="btnStart"><svg><use href="#i-play"/></svg>开始对话</button>
                    <button class="button button-stop" id="btnStop" disabled><svg><use href="#i-stop"/></svg>结束对话</button>
                    <button class="button button-icon" id="btnInterrupt" disabled aria-label="打断当前回答，开始倾听" title="打断当前回答">打断</button>
                    <button class="button button-icon" id="btnMute" disabled aria-label="静音麦克风" aria-pressed="false" title="静音麦克风"><svg><use href="#i-mic"/></svg></button>
                </div>
                <p class="session-hint" id="sessionHint" role="status">可以边听边说，也可以随时打断</p>
            </div>
        </section>
        <aside class="settings-column" aria-label="对话设置与记录">
            <section class="panel prompt-panel" aria-labelledby="promptTitle">
                <div class="panel-heading"><div><span class="panel-icon"><svg><use href="#i-prompt"/></svg></span><h2 id="promptTitle">系统提示词</h2></div><button class="text-button" id="btnResetPrompt">恢复默认</button></div>
                <label class="sr-only" for="systemPrompt">系统提示词</label>
                <textarea id="systemPrompt" rows="4" spellcheck="false" placeholder="描述数字人的角色、语气和回答方式…">你是一名专业、亲切的中文知识传播助手，面向普通大众进行准确、易懂、有温度的知识讲解。你的目标是帮助用户理解概念、建立知识框架，并能在生活或学习中应用。回答时：先准确理解问题，必要时用一句话澄清；默认使用自然、简洁的中文口语，先给核心结论，再分点解释，必要时使用类比或例子；根据用户背景控制专业术语密度，首次出现时进行解释；涉及事实、数据、研究或出处时说明确定性，不编造，不确定就明确说明并给出可靠的核查方向；对争议话题保持中立，呈现主要观点和依据；语音回答避免冗长和复杂格式，一般控制在几句话到一小段，用户要求时再深入展开；合适时可以给一个延伸问题或可执行的小建议，但不要机械追问。始终尊重用户，不传播歧视、仇恨、违法或危险内容。</textarea>
                <div class="prompt-footer"><span>为数字人设定角色与表达方式</span><span id="promptCount">0 字</span></div>
            </section>
            <section class="panel audio-panel" aria-labelledby="audioTitle">
                <div class="panel-heading"><div><span class="panel-icon"><svg><use href="#i-sound"/></svg></span><h2 id="audioTitle">音频设置</h2></div><button class="text-button refresh-button" id="btnRefreshDevices"><svg><use href="#i-refresh"/></svg>刷新设备</button></div>
                <div class="device-grid">
                    <label class="field-label" for="micDevice"><span><svg><use href="#i-mic"/></svg>麦克风</span><select id="micDevice"><option value="">系统默认麦克风</option></select></label>
                    <label class="field-label" for="speakerDevice"><span><svg><use href="#i-speaker"/></svg>扬声器</span><select id="speakerDevice"><option value="">系统默认扬声器</option></select></label>
                </div>
                <div class="volume-row"><label for="volume">播放音量</label><input id="volume" type="range" min="0" max="100" value="80" aria-label="播放音量"><output id="volumeValue" for="volume">80%</output></div>
                <div class="audio-footer"><label class="switch-label"><input type="checkbox" id="echoCancellation" checked><span class="switch" aria-hidden="true"></span>回声消除</label><span>使用耳机，交流更清晰</span></div>
            </section>
            <section class="panel conversation-panel" aria-labelledby="conversationTitle">
                <div class="panel-heading"><div><span class="panel-icon"><svg><use href="#i-chat"/></svg></span><h2 id="conversationTitle">对话</h2><span class="message-count" id="messageCount">0</span></div><button class="text-button" id="btnClearConversation">清空记录</button></div>
                <div class="conversation-log" id="conversationLog" role="log" aria-live="polite" aria-relevant="additions text">
                    <div class="conversation-empty" id="conversationEmpty"><span class="empty-icon"><svg><use href="#i-chat"/></svg></span><strong>对话从一句你好开始</strong><p>点击「开始对话」，与数字人实时交流</p><span class="empty-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
                </div>
                <div class="conversation-footer"><i></i><span id="conversationState">等待开始对话</span><span class="conversation-note">语音实时交互</span></div>
            </section>
        </aside>
    </main>
    <script type="module" src="/static/avatar/avatar-app.js?v=prompt2"></script>
</body>
</html>
