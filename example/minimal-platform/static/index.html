<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Avatar Platform</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, "PingFang SC", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #0d1119; color: #edf2ff; }
        main { max-width: 1060px; margin: auto; padding: 24px; }
        header { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
        h1 { margin: 0; font-size: 24px; }
        .layout { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 20px; margin-top: 20px; }
        .stage { aspect-ratio: 9 / 16; background: #05070b; border-radius: 18px; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        .panel { background: #171d28; border-radius: 16px; padding: 18px; }
        .grid { display: grid; gap: 12px; }
        label { display: grid; gap: 6px; color: #aab8d2; font-size: 14px; }
        select { width: 100%; padding: 10px; border: 1px solid #34415b; border-radius: 10px; background: #0b1018; color: inherit; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
        button { padding: 10px 15px; border: 0; border-radius: 10px; background: #5368ff; color: white; cursor: pointer; }
        button.secondary { background: #2a354a; }
        button:disabled { opacity: .45; cursor: default; }
        .status { color: #91a4c8; }
        #hint { min-height: 22px; color: #97a7c6; line-height: 1.5; }
        #transcript { height: 360px; overflow: auto; margin-top: 12px; display: grid; align-content: start; gap: 10px; }
        .message { padding: 12px; border-radius: 10px; background: #0b1018; white-space: pre-wrap; line-height: 1.5; }
        details { margin-bottom: 16px; }
        summary { cursor: pointer; font-weight: 600; }
        .create-form { display: grid; gap: 10px; margin-top: 12px; }
        .create-form input, .create-form textarea { width: 100%; padding: 9px 10px; border: 1px solid #34415b; border-radius: 8px; background: #0b1018; color: inherit; }
        .create-form textarea { min-height: 90px; resize: vertical; }
        .create-form progress { width: 100%; accent-color: #5368ff; }
        .create-hint { color: #91a4c8; font-size: 12px; }
        @media (max-width: 760px) {
            .layout { grid-template-columns: 1fr; }
            .stage { max-height: 70vh; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>Minimal Avatar Platform</h1>
            <div class="status">Platform BFF → Digital Human Gateway</div>
        </div>
        <span class="status" id="status">未连接</span>
    </header>
    <div class="layout">
        <section class="stage">
            <canvas id="avatarCanvas" width="768" height="1344" aria-label="数字人画面"></canvas>
        </section>
        <section class="panel">
            <details>
                <summary>创建我的数字人形象</summary>
                <form class="create-form" id="createForm">
                    <label>形象视频（最长 20 秒）<input id="customVideo" type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm" required></label>
                    <label>参考音频（最长 20 秒）<input id="customAudio" type="file" accept="audio/wav,audio/mpeg,audio/mp4,audio/flac,audio/ogg,.wav,.mp3,.m4a,.flac,.ogg" required></label>
                    <label>形象名称<input id="customName" type="text" maxlength="80" required></label>
                    <label>形象说明<input id="customDescription" type="text" maxlength="300"></label>
                    <label>提示词<textarea id="customPrompt" required></textarea></label>
                    <button id="createButton" type="submit">上传并生成</button>
                    <progress id="createProgress" max="100" value="0" hidden></progress>
                    <span class="create-hint" id="createHint">视频和音频均不超过 20 秒</span>
                </form>
            </details>
            <div class="grid">
                <label>
                    数字人预设
                    <select id="preset"></select>
                </label>
                <label>
                    麦克风设备
                    <select id="micDevice"></select>
                </label>
            </div>
            <button id="deletePreset" class="secondary" type="button" hidden>
                删除当前自建形象
            </button>
            <div class="actions">
                <button id="start">开始会话</button>
                <button id="interrupt" class="secondary" disabled>打断</button>
                <button id="mute" class="secondary" disabled>静音</button>
                <button id="stop" class="secondary" disabled>结束</button>
                <button id="refreshDevices" class="secondary">刷新麦克风</button>
            </div>
            <div id="hint">点击开始后，浏览器只连接平台服务器的同源 API。</div>
            <div id="transcript" role="log" aria-live="polite"></div>
        </section>
    </div>
</main>
<script type="module" src="/static/app.js?v=avatar-delete1"></script>
</body>
</html>
