# DEFAULT MuseTalk streaming configuration for the 720p knowledge-sharing
# avatar. The original streaming_duplex.yaml and musetalk_test_avatar cache
# remain available as a fallback.

server:
  host: "0.0.0.0"
  port: 8000
  gpu_id: 0
  fps: 24
  batch_size: 28
  prebuffer: 32
  queue_size: 48
  jpeg_quality: 88

models:
  version: v15
  vae_type: sd-vae
  whisper_dir: ./models/whisper
  unet_model_path: ./models/musetalkV15/unet.pth
  unet_config: ./models/musetalkV15/musetalk.json

avatar:
  id: knowledge_host_720p
  video_path: data/video/knowledge_host_720p.mp4
  bbox_shift: 0
  preparation: auto
  extra_margin: 10
  parsing_mode: jaw
  left_cheek_width: 90
  right_cheek_width: 90

inference:
  audio_padding_length_left: 2
  audio_padding_length_right: 2
  feature_window_mode: legacy
  feature_window_left: 4
  feature_window_right: 6
  enable_vad: false
  silence_threshold_dbfs: -45
  silence_merge_gap_frames: 3

live:
  input_mode: stream
  audio_dir: data/audio
  idle_timeout_seconds: 86400
  interrupt_wait_seconds: 10
  interrupt_resume_mode: restart
  poll_interval_seconds: 0.5
  file_stable_seconds: 0.5
  max_prefetch_seconds: 4
  idle_prebuffer_frames: 8
  hold_max_frames: 12
  prebuffer_answer_start_only: true
  process_existing: false
  extensions: [".wav", ".mp3", ".m4a", ".aac", ".ogg", ".flac"]

audio_stream:
  sample_rate: 16000
  channels: 1
  format: s16le
  first_window_frames: 20
  window_frames: 24
  context_left_ms: 200
  context_right_ms: 167
  overlap_frames: 4
  pause_overlap_frames: 4
  pause_boundary_frames: 6
  max_pending_windows: 12
  max_buffer_seconds: 5
